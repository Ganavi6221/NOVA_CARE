org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true
android.enableJetifier=true

# If you see an error like "Unsupported class file major version 69" during Gradle
# execution, your system JDK is too new for some Gradle/Groovy bytecode tools.
# Install a Java 17 JDK and either set JAVA_HOME to it or uncomment and set
# the line below to point Gradle to a compatible JDK installation.
# Example (Windows):
# org.gradle.java.home=C\:\\Program Files\\Java\\jdk-17
